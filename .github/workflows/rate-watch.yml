name: CMA 금리 변경 감시

on:
  schedule:
    # 매일 08:00 KST (= 23:00 UTC 전일)
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: rate-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 금리 확인
        id: check
        run: node watch/check.mjs

      - name: 변경 시 이슈 생성
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.check.outputs.title }}
        run: |
          LABEL=$([ "${{ steps.check.outputs.tier1 }}" = "true" ] && echo "긴급" || echo "금리변경")
          gh label create "$LABEL" --color FF6B35 --force 2>/dev/null || true
          gh issue create \
            --title "$TITLE" \
            --body-file watch/report.md \
            --label "$LABEL"

      - name: 감시 기준값 갱신
        run: |
          git config user.name  "rate-watch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch/baseline.json watch/report.md
          git diff --staged --quiet || git commit -m "chore(watch): 금리 감시 기준값 갱신 $(date -u +%Y-%m-%d)"
          git push
